# BuildFlow project config — non-default information only; unknown keys
# warn at every load (canonical keys: see buildflow skill references).
skip_steps:
  # go-structure-linter is pinned to v0.10.0 in BuildFlow, which predates
  # project-config support: its SDK Lint() does not call LoadProjectConfig,
  # so the .go-structure-linter.yaml `flat` preset for this deliberately
  # flat single-package library is inert and the step reports 17
  # root-package-files errors that the config would exclude. Unskip once
  # BuildFlow pins a go-structure-linter release with project-config
  # support (tracked in TODO_LIST.md, Blocked table).
  - go-structure-linter
  # branching-flow gates on 24 PHANTOM_TYPE findings (critical/error) that
  # demand named string types across the PUBLIC option API
  # (WithTitle/WithWebhook/bearerAuth signatures) — a breaking API redesign
  # that needs a versioning decision, plus 2 BOOL_BLIND errors asking to
  # pack Config/introspectModes bools into bit flags. The tool has no
  # per-project rule/severity config (.branching-flow.yml has only tuning
  # knobs and BuildFlow's provider hardcodes analysis.RunAll options
  # anyway), and phantom/boolblind don't honor //nolint directives — so
  # there is no way to scope it short of skipping. The analyzers that catch
  # real bugs (panic, split-brain, ro-leak) are missed until the fleet fix
  # lands (tracked in TODO_LIST.md, Blocked table).
  - branching-flow
