# Single-package library: the root package IS the public import path
# (github.com/larsartmann/go-health-dashboard). The layout is deliberately
# flat, like go-datastar (ADR-002); the standard cmd/ + internal/ + pkg/
# layout does not apply to root-level library packages.
presets: [flat]
# agent-config excluded (2026-10-07): AGENTS.md is 458 lines vs the 377
# budget — a real debt item, tracked in TODO_LIST.md; trimming 81 lines of
# load-bearing session context is a deliberate owner decision, not a
# pipeline auto-fix. Everything else stays gated.
exclude_patterns: [agent-config]
