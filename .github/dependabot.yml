version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # chromedp + cdproto minors are API-breaking as a PAIR (v0.16 → v0.21
    # needed the documented migration; chromedp ships docs/MIGRATION.md per
    # release and cdproto must move in lockstep). They ride the dedicated
    # migration ceremony, never a dependabot sweep; patch updates stay open.
    ignore:
      - dependency-name: "github.com/chromedp/chromedp"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: "github.com/chromedp/cdproto"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: "github.com/chromedp/cdproto/proto"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      # The UI family must move as ONE change: AGENTS.md requires every UI
      # bump to ship with a green browser suite and a same-change pin-guard
      # update, so templ-components/go-datastar/go-sse land together (the
      # * patterns cover the submodule modules like templ-components/utils).
      ui-family:
        patterns:
          - "github.com/larsartmann/templ-components*"
          - "github.com/larsartmann/go-datastar*"
          - "github.com/larsartmann/go-sse"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
  # Demo-stack supply chain: the digest-pinned prometheus/grafana images
  # (and the root Dockerfile base) bump via proposal, never silently.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
