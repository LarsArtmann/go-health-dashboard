name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOEXPERIMENT: jsonv2

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # CHANGELOG structural lint (pure bash, no Go): exactly one
      # [Unreleased], first section only, monotonic version order. The
      # sandwiched-[Unreleased] bug survived days of doc audits; this
      # turns that class of drift into a build failure.
      - name: CHANGELOG structural lint
        run: bash scripts/check-changelog.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # UI-dependency pin guard: templ-components v1.12.0 re-introduced the
      # LiveRegion busy-script nonce="" regression (upstream #7) and the
      # go-datastar v0.5.0 SDK bundle is unaudited. Remove this step (and
      # scripts/check-ui-pins.sh) once #7 ships and the browser suite
      # validates the new bundles — see the script header for the full
      # removal condition.
      - name: UI dependency pin guard
        run: bash scripts/check-ui-pins.sh

      # Go-directive floor guard: the fleet BuildFlow go-mod-normalize step
      # keeps downgrading `go 1.27.1` to `go 1.27`, which breaks every module
      # load against go-health's floor. Pure bash — fails before any Go tool
      # runs. See scripts/check-go-directive.sh for the restore pattern.
      - name: Go directive floor guard
        run: bash scripts/check-go-directive.sh

      - name: Generate templ files
        # The generator is pinned by go.mod's tool directive — its version
        # cannot drift from the one the committed output was generated with.
        run: go tool templ generate ./...

      - name: Build
        run: go build ./...

  test:
    name: Test (go${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The go.mod floor and the latest 1.27.x patch (verified against
        # the official golang/go tags 2026-09-19): catches patch-level
        # toolchain regressions without widening to new minors.
        go: ["1.27.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}

      - name: UI dependency pin guard
        run: bash scripts/check-ui-pins.sh

      - name: Go directive floor guard
        run: bash scripts/check-go-directive.sh

      - name: Generate templ files
        # The generator is pinned by go.mod's tool directive — its version
        # cannot drift from the one the committed output was generated with.
        run: go tool templ generate ./...

      - name: Test with race detector and coverage
        # Coverage is scoped to the library package: the example carries
        # no tests and its demo-only statements would dilute the floor.
        run: go test . -count=1 -race -timeout=60s -covermode=atomic -coverprofile=coverage.out

      - name: FEATURES test-count drift guard
        run: |
          actual_funcs=$(cat ./*_test.go | grep -cE '^func (Test|Benchmark|Fuzz)')
          set -- ./*_test.go
          actual_files=$#
          expected_funcs=$(grep -oE '[0-9]+ top-level test/benchmark/fuzz functions' FEATURES.md | grep -oE '^[0-9]+')
          expected_files=$(grep -oE 'across [0-9]+ test files' FEATURES.md | grep -oE '[0-9]+')
          echo "FEATURES claims ${expected_funcs} functions across ${expected_files} files; actual ${actual_funcs} across ${actual_files}"
          if [ "$actual_funcs" != "$expected_funcs" ] || [ "$actual_files" != "$expected_files" ]; then
            echo "::error::FEATURES.md test-suite counts drifted from reality — recount with rg and update the Test suite row"
            exit 1
          fi

      - name: Coverage floor
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit !(t >= 80) }' || {
            echo "::error::coverage ${total}% is below the 80% floor (baseline 83.4%)"
            exit 1
          }

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage.out

  browser:
    name: Browser (runtime CSP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Generate templ files
        # The generator is pinned by go.mod's tool directive — its version
        # cannot drift from the one the committed output was generated with.
        run: go tool templ generate ./...

      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/chrome.deb || sudo apt-get -f install -y

      - name: Run headless-browser CSP test
        run: go test ./... -count=1 -run TestBrowser -timeout=120s -v
        env:
          GO_HEALTH_DASHBOARD_CHROME: /usr/bin/google-chrome-stable

      # Regenerate the README captures in CI so screenshot drift (or a
      # regression visible only in the rendered page) shows up as a
      # downloadable artifact instead of a local-only surprise.
      - name: Capture README screenshots
        run: |
          go test . -count=1 -run 'TestCaptureREADME_Screenshot$' -timeout=120s
          go test . -count=1 -run 'TestCaptureREADME_ScreenshotDark' -timeout=120s
          go test . -count=1 -run 'TestCaptureREADME_ScreenshotDegraded' -timeout=120s
        env:
          GO_HEALTH_DASHBOARD_CHROME: /usr/bin/google-chrome-stable
          SCREENSHOT_OUTPUT: /tmp/screenshot.png
          SCREENSHOT_OUTPUT_DARK: /tmp/screenshot-dark.png
          SCREENSHOT_OUTPUT_DEGRADED: /tmp/screenshot-degraded.png

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload screenshot artifacts
        if: always()
        with:
          name: screenshots
          path: /tmp/screenshot*.png
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Generate templ files
        # The generator is pinned by go.mod's tool directive — its version
        # cannot drift from the one the committed output was generated with.
        run: go tool templ generate ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          args: ./...

  vulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Generate templ files
        # The generator is pinned by go.mod's tool directive — its version
        # cannot drift from the one the committed output was generated with.
        run: go tool templ generate ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  version-guard:
    name: Version const matches latest tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compare Version const to latest git tag
        run: |
          const_version=$(grep -E 'const Version = ' dashboard.go | sed -E 's/.*"([^"]+)".*/\1/')
          tag_version=$(git describe --tags --abbrev=0 | sed 's/^v//')
          echo "Version const: ${const_version} | latest tag: ${tag_version}"
          if [ "$const_version" != "$tag_version" ]; then
            echo "::error::Version const (${const_version}) does not match latest git tag (${tag_version}). Bump the const in the same commit as the tag."
            exit 1
          fi

  hygiene:
    name: Hygiene (actionlint, templ drift, flake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Lint workflow files with actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint -color

      - name: Install templ CLI
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      # Canonical generated-file form is `go tool templ generate` output
      # AFTER treefmt (gofumpt regroups the templ-generated imports). So the
      # drift check regenerates, formats, and fails on ANY resulting diff:
      # this catches stale generated files and unformatted files at once.
      - name: templ generate + fmt drift check
        run: |
          go tool templ generate ./...
          nix fmt
          if ! git diff --exit-code; then
            echo "::error::go tool templ generate + nix fmt produced diffs — commit the result of 'go tool templ generate' followed by 'nix fmt'"
            exit 1
          fi

      - name: nix flake check
        run: nix flake check
