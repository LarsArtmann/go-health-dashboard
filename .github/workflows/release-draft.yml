name: Release draft

# Drafts the GitHub Release from the tag's CHANGELOG section the moment a
# version tag lands, so publishing becomes a review step instead of a
# copy step. The release checklist stays authoritative: CI must be green
# on the release commit and the draft reviewed before it is published
# (`gh release edit <tag> --draft=false --latest`) — verify-release.sh
# then checks the published external state.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-draft-${{ github.ref }}

jobs:
  draft:
    name: Draft release notes from CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version-guard discipline guarantees the tag's commit carries
      # the re-headed CHANGELOG section (Version const + section + tag in
      # the same change), so the section always exists at the tag.
      # NOTE: the header is matched with index(), not a regex — awk -v
      # collapses unrecognized escapes, so "\\[" in a -v value became a
      # plain "[" and turned the version into a regex character class
      # that never matched (v0.10.0/v0.10.1 drafts failed on exactly
      # that before this fix).
      - name: Extract the tag's CHANGELOG section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v want="## [$version]" '
            index($0, want) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no CHANGELOG section found for ${version} — re-head [Unreleased] to this version in the tag's commit"
            exit 1
          fi
          cat release-notes.md

      # Mirror of pre-push-checks.sh gate 7, evaluated at the moment that
      # matters: SECURITY.md's supported-versions row must cover the tag
      # being released (the row rots every release; caught 0.10.x-stale
      # against v0.11.0 on 2026-10-25).
      - name: SECURITY.md covers this tag's minor line
        run: |
          version="${GITHUB_REF_NAME#v}"
          security_row=$(grep -oE '^\| [0-9]+\.[0-9]+\.x' SECURITY.md | head -1 | grep -oE '[0-9]+\.[0-9]+')
          minor=$(echo "$version" | cut -d. -f1-2)
          echo "SECURITY.md row ${security_row}.x; releasing ${minor}.x"
          if [ "$security_row" != "$minor" ]; then
            echo "::error::SECURITY.md supported-versions row (${security_row}.x) does not cover ${GITHUB_REF_NAME} — update the row in the same change as the tag"
            exit 1
          fi

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Existence probe runs WITHOUT --jq: on a 404 gh api exits
          # non-zero only when there is no jq filter to succeed on the
          # error JSON. The old probe (`--jq '.draft' || echo absent`)
          # masked the 404 — jq succeeded on the error JSON, printed
          # "null", "null" matched NO case branch, bash exited 0, and no
          # draft was ever created for ANY tag (v0.12.0/v0.12.1 pages
          # were manual).
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            state=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.draft')
            case "$state" in
              true)
                gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
                ;;
              false)
                echo "Release ${GITHUB_REF_NAME} is already published — leaving it untouched (never unpublish a live page)."
                ;;
              *)
                echo "::error::unexpected release state for ${GITHUB_REF_NAME}: draft='${state}' — refusing to guess"
                exit 1
                ;;
            esac
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
