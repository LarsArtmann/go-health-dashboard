name: Nightly Fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOEXPERIMENT: jsonv2

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    name: Fuzz all targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install templ CLI
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate templ files
        run: templ generate ./...

      - name: Fuzz Accept-header parser
        run: go test -run '^$' -fuzz FuzzWantsJSON -fuzztime 60s .

      - name: Fuzz health response serialization
        run: go test -run '^$' -fuzz FuzzHealthResponseSerialization -fuzztime 60s .

      - name: Fuzz Prometheus label escaping
        run: go test -run '^$' -fuzz FuzzEscapeLabelValue -fuzztime 60s .

      - name: Fuzz change-detection fingerprint
        run: go test -run '^$' -fuzz FuzzFingerprintChecks -fuzztime 60s .

      - name: Fuzz CSV exporter
        run: go test -run '^$' -fuzz FuzzCSVExport -fuzztime 60s .

      - name: Fuzz CSP builder
        run: go test -run '^$' -fuzz FuzzRecommendedCSP -fuzztime 60s .

      - name: Fuzz webhook payload marshal
        run: go test -run '^$' -fuzz FuzzWebhookPayload -fuzztime 60s .

      - name: Print crasher inputs
        if: failure()
        run: |
          find testdata/fuzz -type f 2>/dev/null | while read -r crasher; do
            echo "--- $crasher"
            cat "$crasher"
          done

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            if (issues.some((i) => i.title.startsWith("Nightly fuzz failed"))) {
              console.log("An open issue for a failed nightly fuzz run already exists; not creating a duplicate.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly fuzz failed (run ${context.runId})`,
              body: [
                "The scheduled fuzz run failed.",
                "",
                `Run: ${runUrl}`,
                "",
                "Crashers are printed in the \"Print crasher inputs\" step of the run.",
                "Reproduce locally with:",
                "`GOEXPERIMENT=jsonv2 go test -fuzz <target> -fuzztime 30s .`",
                "",
                "Copy the failing input from the crasher corpus file into",
                "`testdata/fuzz/<FuzzTarget>/` to turn the failure into a plain test case.",
              ].join("\n"),
              labels: ["bug"],
            });
