# Prometheus + Grafana demo: runs the example dashboard, Prometheus
# scraping its metrics endpoint, and Grafana with a provisioned dashboard
# (including the per-check last-duration gauge). Start with:
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# Dashboard:  http://localhost:8080/health
# Metrics:    http://localhost:8080/health/metrics
# Prometheus: http://localhost:9090
# Grafana:    http://localhost:3000 (anonymous viewer, no login)
#
# Images are digest-pinned: bumps must be proposed (dependabot opens the
# PRs), never silent. To bump by hand, resolve the manifest-LIST digest
# (not a platform digest):
#   docker buildx imagetools inspect <image:tag> | grep '^Digest:'
services:
  dashboard:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DEMO_TREND: "1"
      DEMO_METRICS: "1"
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v3.4.2@sha256:3b1d5be5c3eef4f027665ddaa3b1a7de8a58d96a0a6de5dd45629afd267ecaf0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      # Readiness, not liveness: /-/ready flips once the web UI is up.
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:9090/-/ready",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  grafana:
    image: grafana/grafana:11.5.2@sha256:8b37a2f028f164ce7b9889e1765b9d6ee23fec80f871d156fbf436d6198d32b7
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:3000/api/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    depends_on:
      # depends_on alone only orders STARTUP; the condition gates on
      # readiness so Grafana cannot boot before the datasource exists.
      prometheus:
        condition: service_healthy
